name: Obsidian release from manifest (reusable)

# Automatic release, so drift cannot form in the first place.
#
# manifest.json is the SOURCE OF TRUTH for the version. This workflow does not
# derive a version from commit messages and never writes to manifest.json. On
# every push to the shipping branch it asks one question: does a tag equal to
# the manifest version exist? If not, it creates the annotated tag on that
# commit and publishes the release with exactly the right asset set.
#
# Tags are bare (no v prefix) and exactly equal to the manifest version,
# because the Obsidian directory requires that.
#
# Idempotent: a push that does not change the version is a no-op.
#
# Consumer pin policy: consumers keep referencing this workflow at @main, on
# purpose. This is a single org with two pushers. The 2026-09-15 near-misses
# were parallel agent sessions racing each other, not outsiders, so pinning
# every consumer to a SHA would buy protection against a threat we do not have
# and cost a fan-out edit across every plugin repo on every change.
#
# The real gap was different: the gate SCRIPT was checked out from @main
# independently of the workflow, so a consumer could run workflow commit A
# against script commit B. That is closed below. The script checkout pins
# itself to ${{ job.workflow_sha }}, the commit of the reusable workflow file
# that defines this job, so the logic always matches the workflow the consumer
# actually resolved.
#
# Seam left open on purpose: tag signing (Tom decision s3g, deferred). When a
# key is chosen, it is one flag on the tag creation in the gate script plus a
# key import step here. Nothing else has to change.
#
# Build provenance (Scaffold Check 0.7.1, step A5). When this run PUBLISHES a
# plugin release, a separate `provenance` job signs the three published assets
# (main.js, manifest.json, styles.css). It signs only after proving that the
# tag is this run's commit and that every published digest equals the tag's
# file, so the attestation can never name a commit the bytes did not come
# from. It is the only job that can mint a signing token; `release` keeps
# `contents: write` and nothing more. A no-op run attests nothing, and a theme
# (manifest.json + theme.css) is not covered yet.
#
# Verify a downloaded file. The signer is THIS reusable workflow, not the
# plugin repo, and pinning it is what makes the check mean anything:
#
#   gh attestation verify main.js \
#     --repo myICOR/<plugin> \
#     --signer-workflow myICOR/.github/.github/workflows/obsidian-release.yml
#
# PERMISSION CONTRACT FOR CALLERS. The provenance job below asks for
# `id-token: write` and `attestations: write`. A reusable workflow can never
# hold more than its caller grants, and GitHub checks this when the run
# STARTS, whatever the `if:` says, so every caller's release.yml must grant
# both to the job that uses this workflow, themes included:
#
#   jobs:
#     release:
#       permissions:
#         contents: write
#         id-token: write
#         attestations: write
#       uses: myICOR/.github/.github/workflows/obsidian-release.yml@main
#
# A caller without the grant fails before any step runs. Callers grant first,
# this file changes second.

on:
  workflow_call:
    inputs:
      kind:
        description: plugin | theme | plugin-source
        required: true
        type: string
      branch:
        required: false
        type: string
        default: main
      build-command:
        description: >
          For plugin-source repos only: the command that produces the release
          assets. Left empty for repos that track their build output in git.
        required: false
        type: string
        default: ''
      node-version:
        required: false
        type: string
        default: '20'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      published: ${{ steps.gate.outputs.published }}
      version: ${{ steps.gate.outputs.version }}
    concurrency:
      group: obsidian-release-${{ github.repository }}-${{ inputs.branch }}
      cancel-in-progress: false
    steps:
      - name: Check out this repo (full history and tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Make the shipping branch available as a local ref
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          # checkout v7 checks out a REAL branch (git checkout -B "$BRANCH"
          # refs/remotes/origin/"$BRANCH"), so fetching into
          # refs/heads/"$BRANCH" is fetching into the checked-out branch and
          # git refuses it locally. Fetch into the remote-tracking ref, which
          # is always allowed, and only materialise the local branch when it
          # is genuinely absent (older checkouts leave a detached HEAD).
          # refs/heads/"$BRANCH" must keep pointing at the commit this job
          # checked out and built: that is the commit the gate reads and the
          # release tags. Never force it to origin/"$BRANCH", which can have
          # moved since checkout.
          git fetch --no-tags --force origin \
            "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          if ! git rev-parse --verify --quiet "refs/heads/$BRANCH" >/dev/null
          then
            git branch --force "$BRANCH" "refs/remotes/origin/$BRANCH"
          fi
          echo "$BRANCH -> $(git rev-parse --verify "refs/heads/$BRANCH")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check out the release logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myICOR/.github
          ref: ${{ job.workflow_sha }}
          path: .release-gate

      - name: The gate script is the workflow's own commit
        env:
          WANT: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test -n "$WANT" || { echo "::error::job.workflow_sha is empty; refusing to run the gate script from an unpinned ref"; exit 1; }
          GOT=$(git -C .release-gate rev-parse HEAD)
          [ "$GOT" = "$WANT" ] || { echo "::error::gate script is at $GOT, workflow is at $WANT"; exit 1; }
          echo "gate script pinned to $GOT"

      - name: Set up Node
        if: inputs.build-command != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Build the release assets
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - name: Tag and release from the manifest
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 .release-gate/scripts/obsidian_release_gate.py release \
            --git-dir .git \
            --gh-repo "$GITHUB_REPOSITORY" \
            --kind "${{ inputs.kind }}" \
            --branch "${{ inputs.branch }}" \
            --asset-dir . | tee release-report.txt
          # Attest only what this run actually published. The gate prints
          # "published release <version> with [...]" after the upload
          # succeeded, and "no-op: ..." when there was nothing to do.
          if grep -q '^published release ' release-report.txt; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            sed -n 's/^published release \([0-9.]*\) with .*/version=\1/p' release-report.txt >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Obsidian release from manifest"
            echo
            echo '```'
            cat release-report.txt 2>/dev/null || echo "(no report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Signs what was published, and only that. No caller input runs here: no
  # build command, no gate script, no persisted credentials. The checks refuse
  # to sign when the tag is not this run's commit (a tag on an older commit,
  # or main moving between the tag push and the release checkout) or when any
  # published digest differs from the tag's file. A refusal leaves the release
  # public but unsigned, and this job red.
  provenance:
    needs: release
    if: needs.release.outputs.published == 'true' && inputs.kind != 'theme'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: The published bytes are the tag's bytes, and the tag is this run's commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          test -n "$VERSION" || { echo "::error::release published but reported no version"; exit 1; }
          [ "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$GITHUB_SHA" ] \
            || { echo "::error::tag $VERSION is not $GITHUB_SHA; not attesting"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" \
            --jq '.assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"' > checksums.txt
          [ "$(wc -l < checksums.txt)" -eq 3 ] || { echo "::error::expected 3 assets"; exit 1; }
          while read -r digest name; do
            case "$name" in main.js|manifest.json|styles.css) ;; *) echo "::error::unexpected asset $name"; exit 1;; esac
            # plugin-source: main.js is build output and not in the tag, so
            # only its published digest is signed.
            if [ "$KIND" = plugin ] || [ "$name" != main.js ]; then
              want=$(git show "HEAD:$name" | sha256sum | cut -d' ' -f1)
              [ "$want" = "$digest" ] || { echo "::error::$name: release $digest, tag $want"; exit 1; }
            fi
          done < checksums.txt
          cat checksums.txt

      - name: Attest build provenance of the published assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: checksums.txt
