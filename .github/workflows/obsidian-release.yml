name: Obsidian release from manifest (reusable)

# Automatic release, so drift cannot form in the first place.
#
# manifest.json is the SOURCE OF TRUTH for the version. This workflow does not
# derive a version from commit messages and never writes to manifest.json. On
# every push to the shipping branch it asks one question: does a tag equal to
# the manifest version exist? If not, it creates the annotated tag on that
# commit and publishes the release with exactly the right asset set.
#
# Tags are bare (no v prefix) and exactly equal to the manifest version,
# because the Obsidian directory requires that.
#
# Idempotent: a push that does not change the version is a no-op.
#
# Consumer pin policy: consumers keep referencing this workflow at @main, on
# purpose. This is a single org with two pushers. The 2026-09-15 near-misses
# were parallel agent sessions racing each other, not outsiders, so pinning
# every consumer to a SHA would buy protection against a threat we do not have
# and cost a fan-out edit across every plugin repo on every change.
#
# The real gap was different: the gate SCRIPT was checked out from @main
# independently of the workflow, so a consumer could run workflow commit A
# against script commit B. That is closed below. The script checkout pins
# itself to ${{ job.workflow_sha }}, the commit of the reusable workflow file
# that defines this job, so the logic always matches the workflow the consumer
# actually resolved.
#
# Seam left open on purpose: tag signing (Tom decision s3g, deferred). When a
# key is chosen, it is one flag on the tag creation in the gate script plus a
# key import step here. Nothing else has to change.

on:
  workflow_call:
    inputs:
      kind:
        description: plugin | theme | plugin-source
        required: true
        type: string
      branch:
        required: false
        type: string
        default: main
      build-command:
        description: >
          For plugin-source repos only: the command that produces the release
          assets. Left empty for repos that track their build output in git.
        required: false
        type: string
        default: ''
      node-version:
        required: false
        type: string
        default: '20'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: obsidian-release-${{ github.repository }}-${{ inputs.branch }}
      cancel-in-progress: false
    steps:
      - name: Check out this repo (full history and tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Make the shipping branch available as a local ref
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          # checkout v7 checks out a REAL branch (git checkout -B "$BRANCH"
          # refs/remotes/origin/"$BRANCH"), so fetching into
          # refs/heads/"$BRANCH" is fetching into the checked-out branch and
          # git refuses it locally. Fetch into the remote-tracking ref, which
          # is always allowed, and only materialise the local branch when it
          # is genuinely absent (older checkouts leave a detached HEAD).
          # refs/heads/"$BRANCH" must keep pointing at the commit this job
          # checked out and built: that is the commit the gate reads and the
          # release tags. Never force it to origin/"$BRANCH", which can have
          # moved since checkout.
          git fetch --no-tags --force origin \
            "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          if ! git rev-parse --verify --quiet "refs/heads/$BRANCH" >/dev/null
          then
            git branch --force "$BRANCH" "refs/remotes/origin/$BRANCH"
          fi
          echo "$BRANCH -> $(git rev-parse --verify "refs/heads/$BRANCH")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check out the release logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myICOR/.github
          ref: ${{ job.workflow_sha }}
          path: .release-gate

      - name: Set up Node
        if: inputs.build-command != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Build the release assets
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - name: Tag and release from the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .release-gate/scripts/obsidian_release_gate.py release \
            --git-dir .git \
            --gh-repo "$GITHUB_REPOSITORY" \
            --kind "${{ inputs.kind }}" \
            --branch "${{ inputs.branch }}" \
            --asset-dir . | tee release-report.txt

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Obsidian release from manifest"
            echo
            echo '```'
            cat release-report.txt 2>/dev/null || echo "(no report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
