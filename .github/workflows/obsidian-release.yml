name: Obsidian release from manifest (reusable)

# Automatic release, so drift cannot form in the first place.
#
# manifest.json is the SOURCE OF TRUTH for the version. This workflow does not
# derive a version from commit messages and never writes to manifest.json. On
# every push to the shipping branch it asks one question: does a tag equal to
# the manifest version exist? If not, it creates the annotated tag on that
# commit and publishes the release with exactly the right asset set.
#
# Tags are bare (no v prefix) and exactly equal to the manifest version,
# because the Obsidian directory requires that.
#
# Idempotent: a push that does not change the version is a no-op.
#
# Consumer pin policy: consumers keep referencing this workflow at @main, on
# purpose. This is a single org with two pushers. The 2026-09-15 near-misses
# were parallel agent sessions racing each other, not outsiders, so pinning
# every consumer to a SHA would buy protection against a threat we do not have
# and cost a fan-out edit across every plugin repo on every change.
#
# The real gap was different: the gate SCRIPT was checked out from @main
# independently of the workflow, so a consumer could run workflow commit A
# against script commit B. That is closed below. The script checkout pins
# itself to ${{ job.workflow_sha }}, the commit of the reusable workflow file
# that defines this job, so the logic always matches the workflow the consumer
# actually resolved.
#
# Seam left open on purpose: tag signing (Tom decision s3g, deferred). When a
# key is chosen, it is one flag on the tag creation in the gate script plus a
# key import step here. Nothing else has to change.
#
# Build provenance (Scaffold Check 0.7.1, step A5). When this run PUBLISHES a
# plugin release, a separate `provenance` job signs the three published assets
# (main.js, manifest.json, styles.css). It signs only after proving that the
# tag is this run's commit and that every published digest equals the tag's
# file, so the attestation can never name a commit the bytes did not come
# from. It is the only job that can mint a signing token; `release` keeps
# `contents: write` and nothing more. A no-op run attests nothing, and a theme
# (manifest.json + theme.css) is not covered yet.
#
# Verify a downloaded file. The signer is THIS reusable workflow, not the
# plugin repo, and pinning it is what makes the check mean anything:
#
#   gh attestation verify main.js \
#     --repo myICOR/<plugin> \
#     --signer-workflow myICOR/.github/.github/workflows/obsidian-release.yml
#
# PERMISSION CONTRACT FOR CALLERS. The provenance job below asks for
# `id-token: write` and `attestations: write`. A reusable workflow can never
# hold more than its caller grants, and GitHub checks this when the run
# STARTS, whatever the `if:` says, so every caller's release.yml must grant
# both to the job that uses this workflow, themes included:
#
#   jobs:
#     release:
#       permissions:
#         contents: write
#         id-token: write
#         attestations: write
#       uses: myICOR/.github/.github/workflows/obsidian-release.yml@main
#
# A caller without the grant fails before any step runs. Callers grant first,
# this file changes second.
#
# Build from the tag (plugin-source, first caller icor-for-life-chat). When
# `build-command` is set, a separate `build` job checks out `ref` (default:
# the commit that triggered the run, which for a tag push IS the tag), runs
# the command with a read-only token and no persisted credentials, and hands
# the complete asset set, built output and tracked files from that one tree,
# to the release job as an artifact. The release job never runs caller code.
# The version gate rebuilds the same tag independently and compares digests,
# so a release that is not reproducible from its tag goes red.
#
# Extra assets. `extra-assets` names tracked files a plugin ships beside the
# base set (SQLite Viewer: sql-wasm.js sql-wasm.wasm). They are published,
# checked against the tag and signed exactly like manifest.json.
#
# Dry run. `dry-run: true` builds and runs the gate with --dry-run: nothing is
# tagged, nothing is published, nothing is signed. The summary lists the
# digest of every asset that would have shipped. Callers expose it as a
# workflow_dispatch rehearsal on an existing tag.

on:
  workflow_call:
    inputs:
      kind:
        description: plugin | theme | plugin-source
        required: true
        type: string
      branch:
        required: false
        type: string
        default: main
      build-command:
        description: >
          For plugin-source repos only: the command that produces the release
          assets. Left empty for repos that track their build output in git.
        required: false
        type: string
        default: ''
      node-version:
        required: false
        type: string
        default: '20'
      node-version-file:
        description: >
          A file in the repo naming the Node version (e.g. .node-version).
          Wins over node-version when set, so the build runs on the same Node
          as the caller's CI.
        required: false
        type: string
        default: ''
      ref:
        description: >
          The commit the build job builds from. Empty means the commit that
          triggered the run (the tag, on a tag push).
        required: false
        type: string
        default: ''
      extra-assets:
        description: >
          Whitespace-separated tracked files shipped beside the kind's base
          asset set, e.g. "sql-wasm.js sql-wasm.wasm".
        required: false
        type: string
        default: ''
      dry-run:
        description: build and gate only; tag, publish and sign nothing
        required: false
        type: boolean
        default: false

jobs:
  build:
    if: inputs.build-command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the commit to build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Build the release assets
        run: ${{ inputs.build-command }}

      - name: Collect the asset set from this one tree
        env:
          KIND: ${{ inputs.kind }}
          EXTRA: ${{ inputs.extra-assets }}
        run: |
          set -euo pipefail
          echo "built from $(git rev-parse HEAD)"
          case "$KIND" in
            plugin|plugin-source) BASE="main.js manifest.json styles.css" ;;
            theme) BASE="manifest.json theme.css" ;;
            *) echo "::error::unknown kind $KIND"; exit 1 ;;
          esac
          OUT="$RUNNER_TEMP/release-assets"
          mkdir -p "$OUT"
          for name in $BASE $EXTRA; do
            [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::bad asset name $name"; exit 1; }
            test -f "$name" || { echo "::error::$name was not produced"; exit 1; }
            cp "$name" "$OUT/$name"
          done
          (cd "$OUT" && sha256sum *)

      - name: Hand the assets to the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    # build is skipped when there is nothing to build; a skipped build must
    # not skip the release, a failed one must.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      published: ${{ steps.gate.outputs.published }}
      version: ${{ steps.gate.outputs.version }}
    concurrency:
      group: obsidian-release-${{ github.repository }}-${{ inputs.branch }}
      cancel-in-progress: false
    steps:
      - name: Check out this repo (full history and tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Make the shipping branch available as a local ref
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          # checkout v7 checks out a REAL branch (git checkout -B "$BRANCH"
          # refs/remotes/origin/"$BRANCH"), so fetching into
          # refs/heads/"$BRANCH" is fetching into the checked-out branch and
          # git refuses it locally. Fetch into the remote-tracking ref, which
          # is always allowed, and only materialise the local branch when it
          # is genuinely absent (older checkouts leave a detached HEAD).
          # refs/heads/"$BRANCH" must keep pointing at the commit this job
          # checked out and built: that is the commit the gate reads and the
          # release tags. Never force it to origin/"$BRANCH", which can have
          # moved since checkout.
          git fetch --no-tags --force origin \
            "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          if ! git rev-parse --verify --quiet "refs/heads/$BRANCH" >/dev/null
          then
            git branch --force "$BRANCH" "refs/remotes/origin/$BRANCH"
          fi
          echo "$BRANCH -> $(git rev-parse --verify "refs/heads/$BRANCH")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check out the release logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myICOR/.github
          ref: ${{ job.workflow_sha }}
          path: .release-gate

      - name: The gate script is the workflow's own commit
        env:
          WANT: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test -n "$WANT" || { echo "::error::job.workflow_sha is empty; refusing to run the gate script from an unpinned ref"; exit 1; }
          GOT=$(git -C .release-gate rev-parse HEAD)
          [ "$GOT" = "$WANT" ] || { echo "::error::gate script is at $GOT, workflow is at $WANT"; exit 1; }
          echo "gate script pinned to $GOT"

      - name: Take the assets the build job made
        if: inputs.build-command != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: .release-assets

      - name: Tag and release from the manifest
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.kind }}
          BRANCH: ${{ inputs.branch }}
          EXTRA: ${{ inputs.extra-assets }}
          DRY_RUN: ${{ inputs.dry-run }}
          ASSET_DIR: ${{ inputs.build-command != '' && '.release-assets' || '.' }}
        run: |
          set -o pipefail
          ARGS=()
          for name in $EXTRA; do ARGS+=(--extra-asset "$name"); done
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python3 .release-gate/scripts/obsidian_release_gate.py release \
            --git-dir .git \
            --gh-repo "$GITHUB_REPOSITORY" \
            --kind "$KIND" \
            --branch "$BRANCH" \
            --asset-dir "$ASSET_DIR" \
            "${ARGS[@]}" | tee release-report.txt
          if [ "$DRY_RUN" = "true" ]; then
            {
              echo "dry run: nothing tagged, published or signed."
              echo "assets in $ASSET_DIR that would ship:"
              case "$KIND" in
                theme) BASE="manifest.json theme.css" ;;
                *) BASE="main.js manifest.json styles.css" ;;
              esac
              for name in $BASE $EXTRA; do
                if [ -f "$ASSET_DIR/$name" ]; then sha256sum "$ASSET_DIR/$name"; else echo "MISSING  $name"; fi
              done
            } | tee -a release-report.txt
          fi
          # Attest only what this run actually published. The gate prints
          # "published release <version> with [...]" after the upload
          # succeeded, and "no-op: ..." when there was nothing to do.
          if grep -q '^published release ' release-report.txt; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            sed -n 's/^published release \([0-9.]*\) with .*/version=\1/p' release-report.txt >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Obsidian release from manifest"
            echo
            echo '```'
            cat release-report.txt 2>/dev/null || echo "(no report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Signs what was published, and only that. No caller input runs here: no
  # build command, no gate script, no persisted credentials. The checks refuse
  # to sign when the tag is not this run's commit (a tag on an older commit,
  # or main moving between the tag push and the release checkout) or when any
  # published digest differs from the tag's file. A refusal leaves the release
  # public but unsigned, and this job red.
  provenance:
    needs: release
    # !cancelled() and an explicit result check: a skipped `build` two jobs
    # up would otherwise skip this job too.
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.published == 'true' && inputs.kind != 'theme' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: The published bytes are the tag's bytes, and the tag is this run's commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          KIND: ${{ inputs.kind }}
          EXTRA: ${{ inputs.extra-assets }}
        run: |
          set -euo pipefail
          test -n "$VERSION" || { echo "::error::release published but reported no version"; exit 1; }
          # HEAD is the commit the assets were built from (ref, or the
          # triggering commit); the tag must be exactly that commit.
          BUILT=$(git rev-parse HEAD)
          [ "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$BUILT" ] \
            || { echo "::error::tag $VERSION is not $BUILT; not attesting"; exit 1; }
          EXPECTED=" main.js manifest.json styles.css $EXTRA "
          WANT=$(echo $EXPECTED | wc -w)
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" \
            --jq '.assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"' > checksums.txt
          [ "$(wc -l < checksums.txt)" -eq "$WANT" ] || { echo "::error::expected $WANT assets"; exit 1; }
          while read -r digest name; do
            # A missing digest renders as "null"; never sign that.
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::$name: no sha256 digest"; exit 1; }
            case "$EXPECTED" in *" $name "*) ;; *) echo "::error::unexpected asset $name"; exit 1;; esac
            # plugin-source: main.js is build output and not in the tag, so
            # only its published digest is signed.
            if [ "$KIND" = plugin ] || [ "$name" != main.js ]; then
              want=$(git show "HEAD:$name" | sha256sum | cut -d' ' -f1)
              [ "$want" = "$digest" ] || { echo "::error::$name: release $digest, tag $want"; exit 1; }
            fi
          done < checksums.txt
          cat checksums.txt

      - name: Attest build provenance of the published assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: checksums.txt
