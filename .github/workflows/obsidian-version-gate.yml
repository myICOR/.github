name: Obsidian version gate (reusable)

# The drift guard. Compares the version NUMBER in manifest.json against the
# BYTES that number names, in three places at once: the git tag, the shipping
# branch, and the published release assets.
#
# Called by each product repo's .github/workflows/version-gate.yml.
# The logic lives once, in scripts/obsidian_release_gate.py in this repo.
#
# Rebuild check (plugin-source). With `build-command` set, a separate
# `rebuild` job checks out the tag the manifest names, builds it with a
# read-only token and no persisted credentials, and hands the digest of the
# build output to the gate. The published main.js must equal it. This is the
# real comparison that `allow-build-output` only ever waived.

on:
  workflow_call:
    inputs:
      kind:
        description: plugin | theme | plugin-source
        required: true
        type: string
      branch:
        description: the shipping branch
        required: false
        type: string
        default: main
      allow-build-output:
        description: >
          Waive the digest check for assets that are build output and so have
          nothing in git to compare against. Only ever true for plugin-source
          repos, and it is a knowing waiver, not a default.
        required: false
        type: boolean
        default: false
      open-issue:
        description: open/refresh a tracking issue when the gate goes red
        required: false
        type: boolean
        default: true
      build-command:
        description: >
          For plugin-source repos: the command that rebuilds the release
          assets from the tag. Set it and the gate compares the published
          build output against a rebuild instead of waiving it.
        required: false
        type: string
        default: ''
      node-version:
        required: false
        type: string
        default: '20'
      node-version-file:
        description: wins over node-version when set, e.g. .node-version
        required: false
        type: string
        default: ''
      extra-assets:
        description: >
          Whitespace-separated tracked files shipped beside the kind's base
          asset set, e.g. "sql-wasm.js sql-wasm.wasm".
        required: false
        type: string
        default: ''

jobs:
  rebuild:
    if: inputs.build-command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      rebuilt: ${{ steps.digest.outputs.rebuilt }}
    steps:
      - name: Check out the shipping branch (full history and tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Switch to the tag the manifest names
        id: tag
        run: |
          set -euo pipefail
          V=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if git rev-parse --verify --quiet "refs/tags/$V^{commit}" >/dev/null; then
            git checkout --quiet --detach "refs/tags/$V"
            echo "rebuilding tag $V at $(git rev-parse HEAD)"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            # The gate reports the missing tag; with no rebuild digest the
            # build output also stays unverified, which is red.
            echo "::warning::no tag $V to rebuild"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.tag.outputs.found == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Rebuild
        if: steps.tag.outputs.found == 'true'
        run: ${{ inputs.build-command }}

      - name: Digest of the rebuilt output
        id: digest
        if: steps.tag.outputs.found == 'true'
        run: |
          set -euo pipefail
          test -f main.js || { echo "::error::the rebuild produced no main.js"; exit 1; }
          D=$(sha256sum main.js | cut -d' ' -f1)
          echo "main.js $D"
          echo "rebuilt=main.js=$D" >> "$GITHUB_OUTPUT"

  gate:
    needs: rebuild
    # rebuild is skipped when there is nothing to build. The gate runs either
    # way, and a failed rebuild leaves the build output unverified, so red.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out this repo (full history and tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Make the shipping branch available as a local ref
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          # checkout v7 checks out a REAL branch (git checkout -B "$BRANCH"
          # refs/remotes/origin/"$BRANCH"), so fetching into
          # refs/heads/"$BRANCH" is fetching into the checked-out branch and
          # git refuses it locally. Fetch into the remote-tracking ref, which
          # is always allowed, and only materialise the local branch when it
          # is genuinely absent (older checkouts leave a detached HEAD).
          # refs/heads/"$BRANCH" must keep pointing at the commit this job
          # checked out and built: that is the commit the gate reads and the
          # release tags. Never force it to origin/"$BRANCH", which can have
          # moved since checkout.
          git fetch --no-tags --force origin \
            "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          if ! git rev-parse --verify --quiet "refs/heads/$BRANCH" >/dev/null
          then
            git branch --force "$BRANCH" "refs/remotes/origin/$BRANCH"
          fi
          echo "$BRANCH -> $(git rev-parse --verify "refs/heads/$BRANCH")"

      - name: Check out the gate logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myICOR/.github
          ref: ${{ job.workflow_sha }}
          path: .release-gate

      - name: The gate script is the workflow's own commit
        env:
          WANT: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test -n "$WANT" || { echo "::error::job.workflow_sha is empty; refusing to run the gate script from an unpinned ref"; exit 1; }
          GOT=$(git -C .release-gate rev-parse HEAD)
          [ "$GOT" = "$WANT" ] || { echo "::error::gate script is at $GOT, workflow is at $WANT"; exit 1; }
          echo "gate script pinned to $GOT"

      - name: Run the gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          WAIVE: ${{ inputs.allow-build-output }}
          REBUILT: ${{ needs.rebuild.outputs.rebuilt }}
          EXTRA: ${{ inputs.extra-assets }}
          KIND: ${{ inputs.kind }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -o pipefail
          FLAGS=()
          if [ "$WAIVE" = "true" ]; then FLAGS+=(--allow-build-output); fi
          if [ -n "$REBUILT" ]; then FLAGS+=(--rebuilt "$REBUILT"); fi
          for name in $EXTRA; do FLAGS+=(--extra-asset "$name"); done
          set +e
          python3 .release-gate/scripts/obsidian_release_gate.py check \
            --git-dir .git \
            --gh-repo "$GITHUB_REPOSITORY" \
            --kind "$KIND" \
            --branch "$BRANCH" \
            "${FLAGS[@]}" 2>&1 | tee gate-report.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Obsidian version gate"
            echo
            echo '```'
            cat gate-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or refresh the drift issue
        if: steps.gate.outputs.code != '0' && inputs.open-issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Version gate: the version number and the shipped bytes disagree"
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The version gate went red on \`$BRANCH\` at commit \`$SHA\`."
            echo
            echo '```'
            cat gate-report.txt
            echo '```'
            echo
            echo "Run: $RUN_URL"
          } > issue-body.md
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
            echo "refreshed issue #$EXISTING"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --body-file issue-body.md
          fi

      - name: Close the drift issue once the gate is green again
        if: steps.gate.outputs.code == '0' && inputs.open-issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Version gate: the version number and the shipped bytes disagree"
        run: |
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --comment "Gate is green again at \`${{ github.sha }}\`."
          fi

      - name: Fail the run if the gate went red
        if: steps.gate.outputs.code != '0'
        run: |
          echo "::error::Version gate RED - see the job summary and the tracking issue."
          exit 1
